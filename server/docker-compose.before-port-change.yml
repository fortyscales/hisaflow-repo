services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hisaflow
      POSTGRES_USER: hisaflow
      POSTGRES_PASSWORD: hisaflow_dev
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hisaflow -d hisaflow"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - hisaflow_pg_test:/var/lib/postgresql/data
volumes:
  hisaflow_pg_test:
